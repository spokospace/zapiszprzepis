<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — /login z OAuth (E01-S12)</title>
<style>
  :root { --ink:#111827; --muted:#374151; --field:#6b7280; --action:#c2410c; --focus:#1d4ed8; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 19px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px; display:flex; flex-direction:column; gap:20px; }
  .logo { font-weight:800; font-size:28px; color:var(--action); }
  h2 { font-size:24px; margin:0; }
  .oauth { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:56px; border:2px solid var(--field); border-radius:12px; background:#fff; color:var(--ink); font-size:19px; font-weight:600; }
  .oauth:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:16px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--field); }
  .tabs { display:flex; gap:8px; border-bottom:1px solid var(--field); font-size:16px; }
  .tabs span { padding:8px 16px; } .tabs .on { border-bottom:3px solid var(--ink); font-weight:600; }
  label { font-size:16px; font-weight:600; }
  input { width:100%; min-height:48px; border:2px solid var(--field); border-radius:8px; padding:8px 12px; font-size:19px; }
  .primary { width:100%; min-height:56px; border:0; border-radius:12px; background:var(--action); color:#fff; font-size:19px; font-weight:700; }
  .note { font-size:16px; color:var(--muted); margin:0; }
</style>
</head>
<body>
<main>
  <div class="logo">ZapiszPrzepis</div>
  <h2>Zaloguj się</h2>
  <button class="oauth" type="button">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
    Zaloguj przez Google
  </button>
  <button class="oauth" type="button">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
    Zaloguj przez Facebooka
  </button>
  <div class="divider">lub emailem</div>
  <div class="tabs"><span class="on">Link</span><span>Hasło</span></div>
  <div>
    <label for="e">Email</label>
    <input id="e" type="email" placeholder="ty@example.com">
  </div>
  <button class="primary" type="button">Wyślij link</button>
  <p class="note">Pierwsze logowanie przez Google lub Facebooka zakłada konto.</p>
</main>
</body>
</html>
