<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="link" tabIndex="0" aria-label="{{ c.t }}" onClick="{{ c.onOpen }}" onKeyDown="{{ c.onKey }}" style="height:100%;box-sizing:border-box;background:transparent;border:0;border-radius:12px;display:flex;flex-direction:column;cursor:pointer;font-family:'Atkinson Hyperlegible Next',Arial,Helvetica,sans-serif;color:#111827" style-hover="opacity:.92">
  <div style="position:relative;height:{{ c.imgH }};flex-shrink:0;border-radius:4px;overflow:hidden;background:repeating-linear-gradient(135deg,#fdf0e4 0 10px,#fbe6d3 10px 20px)">
    <button type="button" aria-label="{{ c.favLabel }}" aria-pressed="{{ c.isFav }}" title="{{ c.favLabel }}" onClick="{{ c.onFav }}" style="position:absolute;right:8px;top:8px;width:48px;height:48px;box-sizing:border-box;border-radius:999px;background:{{ c.favBg }};border:0;box-shadow:0 2px 8px rgba(17,24,39,.22);color:{{ c.favColor }};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer">{{ c.heartEl }}</button>
    <span style="position:absolute;left:1px;bottom:6px;max-width:calc(100% - 12px);box-sizing:border-box;padding:4px 12px 4px 10px;border-radius:0 2px 2px 0;border:0;background:#fff;font-size:16px;font-weight:700;color:#111827;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden">{{ c.srcEl }}<span style="overflow:hidden;text-overflow:ellipsis">{{ c.a }}</span></span>
  </div>
  <div style="padding:10px 0 4px;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:21px;font-weight:700;line-height:1.2;text-wrap:pretty">{{ c.t }}</span>
    <sc-if value="{{ c.s }}" hint-placeholder-val="{{ true }}"><span style="font-size:17px;color:#374151;line-height:1.4">{{ c.s }}</span></sc-if>
    <sc-if value="{{ c.time }}" hint-placeholder-val="{{ false }}"><span style="font-size:16px;color:#374151;line-height:1.4">{{ c.time }}</span></sc-if>
    <sc-if value="{{ c.plus }}" hint-placeholder-val="{{ false }}">
      <div style="border-top:1px solid #e5e7eb;margin-top:4px;padding-top:8px;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:16px;color:#111827;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"><b>Ma dodatkowo:</b> {{ c.plus }}</span>
        <sc-if value="{{ c.minus }}" hint-placeholder-val="{{ false }}"><span style="font-size:16px;color:#111827;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"><b>Nie ma:</b> {{ c.minus }}</span></sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:340},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
